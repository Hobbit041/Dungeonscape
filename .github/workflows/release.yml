name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # On a tag push the tag itself wins; a manual run falls back to the
      # version in package.json, so the release always matches the build.
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: $tag"

      # Created once, up front, so the three build jobs can upload into it
      # without racing each other to create it.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: npm run build:mac
          - os: windows-latest
            build: npm run build
          - os: ubuntu-latest
            build: npx electron-builder --linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: ${{ matrix.build }}
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Straight into the release instead of actions/upload-artifact, which
      # bills storage for files we only ever wanted on the releases page.
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
          fail_on_unmatched_files: false
