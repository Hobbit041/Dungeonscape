<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeonscape — Remote</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ── Canvas (the "desktop" the app-window sits on) ──────────────── */
    html, body { height: 100%; margin: 0; overflow: hidden; background: #0d0d10; }
    #canvas { position: relative; width: 100%; height: 100%; overflow: hidden; }

    /* ── Connection badge — outside the canvas, fixed page chrome ────── */
    #wsStatus {
      position: fixed; top: 8px; right: 8px; z-index: 1000;
      font-size: 11px; padding: 2px 8px; border-radius: 10px;
      background: #444; color: var(--text-dim);
    }
    #wsStatus.connected    { background: #1a4a1a; color: #6f6; }
    #wsStatus.disconnected { background: #4a1a1a; color: #f66; }

    /* ── App-window panel ─────────────────────────────────────────────
       #app-window plays the role of renderer/index.html's #app: same
       internal structure/classes, just absolutely positioned on the
       canvas instead of filling the OS window. */
    #app-window {
      position: absolute; left: 0; top: 0;
      display: flex; flex-direction: column;
      background: var(--bg, #1a1a1e);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      overflow: hidden;
    }
    #app-window-title {
      flex: 0 0 auto; cursor: move; user-select: none;
    }
    #app-window-body {
      flex: 1 1 auto; min-height: 0; overflow: auto;
      display: flex; flex-direction: column;
    }
    #app-window-resize-handle {
      position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, var(--accent, #4a9eff) 50%);
    }

    /* Soundboard grid: same override the old client used — the shared
       stylesheet sizes the grid for the desktop's own layout. */
    #soundboard-grid {
      grid-template-columns: repeat(var(--sb-cols, 5), 1fr);
      grid-template-rows: none;
      grid-auto-rows: auto;
      flex: none;
      width: 100% !important;
      height: auto !important;
    }
    .sb-cell { aspect-ratio: 1 / 1; }
  </style>
</head>
<body>

  <div id="wsStatus" class="disconnected">● нет связи</div>

  <div id="canvas">
    <div id="app-window">
      <div id="app-window-title" class="detached-title-bar">
        <span class="detached-title-bar-name" id="app-window-title-text">♫ Dungeonscape</span>
      </div>

      <div id="app-window-body">
        <main id="main-area">

          <section id="mixer-section">
            <div id="channel-strip-row"></div>
            <div id="ambient-strip-row"></div>
            <div id="scenes-section">
              <div id="scenes-row"></div>
            </div>
          </section>

          <section id="soundboard-section">
            <div id="soundboard-header">
              <span class="sb-title">Звуковая панель</span>
              <div class="sb-controls">
                <label>Громкость</label>
                <input id="sbVolume" type="range" min="0" max="125" step="1" value="50">
                <button id="sbStopAll" class="btn-stop-sb" title="Остановить все звуки саундборда">
                  <i class="fas fa-stop"></i> <span>Остановить звуки</span>
                </button>
              </div>
            </div>

            <div id="soundboard-grid-outer">
              <div id="soundboard-grid"></div>
            </div>

            <div id="sb-scenes-section">
              <div id="sb-scenes-row"></div>
            </div>
          </section>

        </main>
      </div>

      <div id="app-window-resize-handle"></div>
    </div>
  </div>

<script type="module" src="/app.js"></script>
</body>
</html>
