<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dungeonscape</title>
  <script>
    // Suppress Electron 28 Web MIDI output internal bug: async ReferenceError for dragEvent
    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('dragEvent')) { e.preventDefault(); }
    });
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="app">

  <!-- ═══ HEADER ═══════════════════════════════════════════════════════════ -->
  <header id="header">
    <div class="header-left">
      <span class="app-logo"><i class="fas fa-music"></i> Dungeonscape</span>
      <span id="midiStatus" class="midi-status" data-i18n="header.midiStatusScanning"></span>
    </div>
    <div class="header-center">
      <input id="soundscapeName" type="text" data-i18n-placeholder="header.soundscapeNamePlaceholder" spellcheck="false">
      <button id="soundscapeList" data-i18n-title="header.profilesTitle"><i class="fas fa-bars"></i></button>
      <button id="settingsBtn"    data-i18n-title="header.settingsTitle"><i class="fas fa-cog"></i></button>
    </div>
    <div class="header-right">
      <button id="btnImport" data-i18n-title="header.importTitle"><i class="fas fa-file-import"></i></button>
      <button id="btnExport" data-i18n-title="header.exportTitle"><i class="fas fa-file-export"></i></button>
    </div>
    <div class="win-controls">
      <button class="win-btn win-minimize" id="winMinimize" data-i18n-title="header.winMinimize">&#8722;</button>
      <button class="win-btn win-maximize" id="winMaximize" data-i18n-title="header.winMaximize">&#9633;</button>
      <button class="win-btn win-close"    id="winClose"    data-i18n-title="header.winClose">&#10005;</button>
    </div>
  </header>
